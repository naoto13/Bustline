name = "bustline-keeper"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "KEEPER_STATE"
id = "775a3796c17a4990b665ac9c76aaa4bf"

[vars]
RPC_URL = "https://rpc.test.mezo.org"
TICK_SECONDS = "15"
RUN_SECONDS = "46"
HEARTBEAT_SECONDS = "300"
# Contract addresses (v2 = deployments/testnet.json). For v3, set both from deployments/testnet-v3.json and SP_OPS = "1".
EXCHANGE_ADDRESS = "0x5e941EEA56DEE50924950E86f24624Be37f02050"
ORACLE_ADDRESS = "0x83401Fc1B16DbCa09531241Dad49700248C8c72c"
# "1" only for HouseExchange v3 (rebalance / forwardBtc). At most one SP check per SP_INTERVAL_SECONDS.
SP_OPS = "0"
SP_INTERVAL_SECONDS = "300"

[observability]
enabled = true
