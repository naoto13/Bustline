name = "bustline-keeper"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "KEEPER_STATE"
id = "775a3796c17a4990b665ac9c76aaa4bf"

[vars]
RPC_URL = "https://rpc.test.mezo.org"
TICK_SECONDS = "15"
RUN_SECONDS = "46"
HEARTBEAT_SECONDS = "300"
# Contract addresses: v3 (deployments/testnet-v3.json). v2 (deployments/testnet.json) is frozen.
EXCHANGE_ADDRESS = "0x50828BbB08dce68eEf2588357Ef5FAE1f67f9F58"
ORACLE_ADDRESS = "0xb4321D6d7E6B3f804B386E6A27d9e70DDc8e85A0"
# "1" only for HouseExchange v3 (rebalance / forwardBtc). At most one SP check per SP_INTERVAL_SECONDS.
SP_OPS = "1"
SP_INTERVAL_SECONDS = "300"

[observability]
enabled = true
