name = "bustline-keeper"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
# Pin the account: wrangler otherwise reuses the account cached in node_modules/.cache/wrangler.
account_id = "cf45610bbc3fc7f71062352c48721f7a"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "KEEPER_STATE"
id = "715b3de67fcf461a89def294c856f16b"

[vars]
RPC_URL = "https://rpc.test.mezo.org"
TICK_SECONDS = "15"
RUN_SECONDS = "46"
HEARTBEAT_SECONDS = "300"
# Contract addresses: v3.1 (deployments/testnet-v3.1.json, 2026-11-07). v3 and v2 are retired.
EXCHANGE_ADDRESS = "0x3c58314cd5710893519E5d962F553633ECC60cF7"
ORACLE_ADDRESS = "0x75a3071482883d9616bf0473B7eE25B4222b181F"
# "1" only for HouseExchange v3 / v3.1 (rebalance / forwardBtc). At most one SP check per SP_INTERVAL_SECONDS.
SP_OPS = "1"
SP_INTERVAL_SECONDS = "300"

[observability]
enabled = true
