[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "london"
ffi = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[lint]
lint_on_build = false
